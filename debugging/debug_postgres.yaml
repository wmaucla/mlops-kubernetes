apiVersion: v1
kind: Pod
metadata:
  name: postgres-client
spec:
  containers:
  - name: postgres-client
    image: postgres:latest  # Use the PostgreSQL client image
    env:
      - name: POSTGRES_USER
        value: yourusername   # Use the same PostgreSQL username as in values.yaml
      - name: POSTGRES_10.244.0.10
        value: your10.244.0.10   # Use the same PostgreSQL 10.244.0.10 as in values.yaml
    command: ["sleep"]
    args: ["infinity"]
  restartPolicy: Never